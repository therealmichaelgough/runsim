[/Script/Engine.InputSettings]
; --- classic input -------------------------------------------------------
; UE 5.x defaults to Enhanced Input, whose mappings live in .uasset files.
; This project is text-only, so it opts back into the legacy PlayerInput,
; which reads the axis/action mappings below straight out of this .ini.
DefaultPlayerInputClass=/Script/Engine.PlayerInput
DefaultInputComponentClass=/Script/Engine.InputComponent

bAltEnterTogglesFullscreen=True
bF11TogglesFullscreen=True
bUseMouseForTouch=False
bEnableMouseSmoothing=True
bEnableFOVScaling=True
bCaptureMouseOnLaunch=True
DefaultViewportMouseCaptureMode=CapturePermanently_IncludingInitialMouseDown
DefaultViewportMouseLockMode=LockOnCapture

+AxisConfig=(AxisKeyName="MouseX",AxisProperties=(DeadZone=0.000000,Sensitivity=0.070000,Exponent=1.000000,bInvert=False))
+AxisConfig=(AxisKeyName="MouseY",AxisProperties=(DeadZone=0.000000,Sensitivity=0.070000,Exponent=1.000000,bInvert=False))
+AxisConfig=(AxisKeyName="MouseWheelAxis",AxisProperties=(DeadZone=0.000000,Sensitivity=1.000000,Exponent=1.000000,bInvert=False))
+AxisConfig=(AxisKeyName="Gamepad_LeftX",AxisProperties=(DeadZone=0.250000,Sensitivity=1.000000,Exponent=1.000000,bInvert=False))
+AxisConfig=(AxisKeyName="Gamepad_RightX",AxisProperties=(DeadZone=0.250000,Sensitivity=1.000000,Exponent=1.000000,bInvert=False))
+AxisConfig=(AxisKeyName="Gamepad_RightY",AxisProperties=(DeadZone=0.250000,Sensitivity=1.000000,Exponent=1.000000,bInvert=False))
+AxisConfig=(AxisKeyName="Gamepad_LeftTriggerAxis",AxisProperties=(DeadZone=0.100000,Sensitivity=1.000000,Exponent=1.000000,bInvert=False))
+AxisConfig=(AxisKeyName="Gamepad_RightTriggerAxis",AxisProperties=(DeadZone=0.100000,Sensitivity=1.000000,Exponent=1.000000,bInvert=False))

; --- target running speed (m/s) -----------------------------------------
+AxisMappings=(AxisName="RunsimSpeed",Key=W,Scale=1.000000)
+AxisMappings=(AxisName="RunsimSpeed",Key=Up,Scale=1.000000)
+AxisMappings=(AxisName="RunsimSpeed",Key=S,Scale=-1.000000)
+AxisMappings=(AxisName="RunsimSpeed",Key=Down,Scale=-1.000000)
+AxisMappings=(AxisName="RunsimSpeed",Key=Gamepad_RightTriggerAxis,Scale=1.000000)
+AxisMappings=(AxisName="RunsimSpeed",Key=Gamepad_LeftTriggerAxis,Scale=-1.000000)

; --- steering (heading; the runner yaws at a rate-limited 60 deg/s max) --
+AxisMappings=(AxisName="RunsimSteer",Key=D,Scale=1.000000)
+AxisMappings=(AxisName="RunsimSteer",Key=A,Scale=-1.000000)
+AxisMappings=(AxisName="RunsimSteer",Key=Right,Scale=1.000000)
+AxisMappings=(AxisName="RunsimSteer",Key=Left,Scale=-1.000000)
+AxisMappings=(AxisName="RunsimSteer",Key=Gamepad_LeftX,Scale=1.000000)

; --- terrain hilliness ---------------------------------------------------
+AxisMappings=(AxisName="RunsimHills",Key=H,Scale=1.000000)
+AxisMappings=(AxisName="RunsimHills",Key=F,Scale=-1.000000)
+AxisMappings=(AxisName="RunsimHills",Key=Gamepad_DPad_Up,Scale=1.000000)
+AxisMappings=(AxisName="RunsimHills",Key=Gamepad_DPad_Down,Scale=-1.000000)

; --- camera orbit (held right mouse) / zoom ------------------------------
+AxisMappings=(AxisName="RunsimTurn",Key=MouseX,Scale=1.000000)
+AxisMappings=(AxisName="RunsimTurn",Key=Gamepad_RightX,Scale=1.000000)
+AxisMappings=(AxisName="RunsimLookUp",Key=MouseY,Scale=-1.000000)
+AxisMappings=(AxisName="RunsimLookUp",Key=Gamepad_RightY,Scale=1.000000)
+AxisMappings=(AxisName="RunsimZoom",Key=MouseWheelAxis,Scale=1.000000)

+ActionMappings=(ActionName="RunsimOrbit",bShift=False,bCtrl=False,bAlt=False,bCmd=False,Key=RightMouseButton)
+ActionMappings=(ActionName="RunsimPause",bShift=False,bCtrl=False,bAlt=False,bCmd=False,Key=SpaceBar)
+ActionMappings=(ActionName="RunsimPause",bShift=False,bCtrl=False,bAlt=False,bCmd=False,Key=Gamepad_FaceButton_Bottom)
