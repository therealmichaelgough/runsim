[/Script/EngineSettings.GameMapsSettings]
; This project ships no .umap of its own (a level is a binary asset and the
; repo is deliberately text-only). /Engine/Maps/Entry is an empty map that
; ships with the engine; ARunsimGameMode spawns the runner, the terrain and
; the lights itself, so any empty level works.
GameDefaultMap=/Engine/Maps/Entry
EditorStartupMap=/Engine/Maps/Entry
ServerDefaultMap=/Engine/Maps/Entry
GlobalDefaultGameMode=/Script/RunsimViewer.RunsimGameMode
GlobalDefaultServerGameMode=/Script/RunsimViewer.RunsimGameMode

[/Script/Engine.RendererSettings]
